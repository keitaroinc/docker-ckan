name: CKAN Docker Images CI

on:
  pull_request:
    branches:
      - master
  schedule:
    - cron: '28 3 * * 5'

# Concurrency setting to cancel old runs on PRs when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Get the list of CKAN image versions
  matrix_generator:
    name: CKAN Image Matrix
    uses: ./.github/workflows/ckan_image_matrix.yml

  # Lint the Dockerfiles (only runs on Pull Requests)
  lint:
    name: Lint Dockerfiles
    if: github.event_name == 'pull_request'
    needs: matrix_generator
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJSON(needs.matrix_generator.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Lint CKAN ${{ matrix.version }}
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./images/ckan/${{ matrix.version }}/Dockerfile

  # Build the images (only runs on Pull Requests)
  build:
    name: Build Images
    if: github.event_name == 'pull_request'
    needs: matrix_generator
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ${{ fromJSON(needs.matrix_generator.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image ${{ matrix.version }}
        uses: docker/build-push-action@v6
        with:
          context: ./images/ckan/${{ matrix.version }}
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Scan for vulnerabilities (runs on all triggers)
  security_scan:
    name: Security Scan
    needs: matrix_generator
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        version: ${{ fromJSON(needs.matrix_generator.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Build image for CKAN ${{ matrix.version }}
        run: docker build -t internal/ckan/${{ matrix.version }}:${{ github.sha }} ./images/ckan/${{ matrix.version }}/

      - name: Run Trivy on image ${{ matrix.version }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'internal/ckan/${{ matrix.version }}:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-image-${{ matrix.version }}


  # Boot each built image against the repo's own stack and verify CKAN serves traffic.
  # amd64-only runtime check (arm64 under emulation would be too slow); the build job covers both arches.
  smoke_test:
    name: Smoke Test
    if: github.event_name == 'pull_request'
    needs: matrix_generator
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.matrix_generator.outputs.versions) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve full CKAN version
        id: ver
        run: |
          IMAGE_TAG=$(grep -oP 'ENV IMAGE_TAG="\K[^"]+' images/ckan/${{ matrix.version }}/Dockerfile)
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build CKAN ${{ matrix.version }} image (tagged so compose uses it)
        uses: docker/build-push-action@v6
        with:
          context: ./images/ckan/${{ matrix.version }}
          load: true
          push: false
          tags: ghcr.io/keitaroinc/ckan:${{ steps.ver.outputs.image_tag }}
          cache-from: type=gha

      - name: Check compose resolves the image we just built
        working-directory: compose
        env:
          CKAN_VERSION: ${{ steps.ver.outputs.image_tag }}
        run: |
          # config/.global-env pins CKAN_VERSION=2.12.0; fail loudly if the override ever
          # stops winning, instead of silently testing (or pulling) the wrong image.
          config=$(docker compose config)
          echo "$config" | grep "image: ghcr.io/keitaroinc/ckan" | sort -u
          echo "$config" | grep -q "image: ghcr.io/keitaroinc/ckan:${CKAN_VERSION}"

      - name: Start the stack
        working-directory: compose
        env:
          CKAN_VERSION: ${{ steps.ver.outputs.image_tag }}
        run: docker compose up -d --build

      - name: Wait for CKAN health
        working-directory: compose
        env:
          CKAN_VERSION: ${{ steps.ver.outputs.image_tag }}
        run: |
          echo "Waiting for CKAN to become healthy..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:5000/api/3/action/status_show >/dev/null 2>&1; then
              echo "CKAN is up:"
              curl -s http://localhost:5000/api/3/action/status_show
              exit 0
            fi
            sleep 10
          done
          echo "CKAN did not become healthy in time. Recent CKAN logs:"
          docker compose logs ckan --tail=200
          exit 1

      - name: Dump stack state on failure
        if: failure()
        working-directory: compose
        env:
          CKAN_VERSION: ${{ steps.ver.outputs.image_tag }}
        run: |
          docker compose ps -a
          docker compose logs --tail=200

      - name: Teardown
        if: always()
        working-directory: compose
        env:
          CKAN_VERSION: ${{ steps.ver.outputs.image_tag }}
        run: docker compose down -v || true
